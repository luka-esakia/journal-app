name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships a licensed Android SDK, so there is nothing to install —
      # just locate it, pin it in local.properties, and add the platform if the image lacks it.
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Installed platforms:"
          ls "$SDK/platforms" || true

          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "android-34 missing — installing it with the preinstalled sdkmanager"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      # Android refuses to install an update signed with a different key. Without a stable
      # keystore every run produces an APK that can only be installed after uninstalling the
      # previous one. Preference order: repo-committed key, then secret, then a cached
      # generated key, then (last resort) an ephemeral one.
      # Step 1 — the authoritative source, if configured. Checked before the cache so a stale
      # cached key can never shadow the secret.
      - name: Use keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f keystore/mindjournal.jks ]; then
            echo "KEYSTORE_SOURCE=committed" >> "$GITHUB_ENV"
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p keystore

            # Strip all whitespace first: pastes arrive wrapped, with CRLFs, or with a trailing
            # newline depending on how the secret was created, and GNU base64 rejects the lot.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/keystore.b64
            chars=$(wc -c < /tmp/keystore.b64)
            echo "KEYSTORE_BASE64 contains $chars base64 characters (expected ~3400)."

            if ! base64 -d /tmp/keystore.b64 > keystore/mindjournal.jks 2>/dev/null; then
              rm -f keystore/mindjournal.jks
              echo "::error::KEYSTORE_BASE64 is not valid base64 ($chars chars). Re-copy it with:"
              echo "::error::base64 -i keystore/mindjournal.jks | pbcopy   (macOS)"
              echo "::error::and paste the whole value into the secret with no extra characters."
              exit 1
            fi

            # A PKCS12 keystore is DER: it must start with a SEQUENCE tag (0x30 0x82).
            size=$(wc -c < keystore/mindjournal.jks)
            magic=$(head -c 2 keystore/mindjournal.jks | od -An -tx1 | tr -d ' \n')
            if [ "$size" -lt 1000 ] || [ "$magic" != "3082" ]; then
              rm -f keystore/mindjournal.jks
              echo "::error::Decoded $size bytes starting with '$magic' — that is not a PKCS12"
              echo "::error::keystore. The secret is probably truncated; expected ~2548 bytes."
              exit 1
            fi

            echo "Decoded a $size-byte keystore from the secret."
            echo "KEYSTORE_SOURCE=secret" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret set; falling back to a cached or generated key."
            echo "KEYSTORE_SOURCE=none" >> "$GITHUB_ENV"
          fi
          rm -f /tmp/keystore.b64

      # Step 2 — best-effort persistence when no secret is configured. Caches can be evicted,
      # which is why the secret is the documented path.
      - name: Restore cached keystore
        if: env.KEYSTORE_SOURCE == 'none'
        uses: actions/cache@v4
        with:
          path: keystore
          key: mindjournal-keystore-v1

      - name: Generate keystore if still missing
        if: env.KEYSTORE_SOURCE == 'none'
        run: |
          set -euo pipefail
          if [ -f keystore/mindjournal.jks ]; then
            echo "Restored keystore from cache."
          else
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/mindjournal.jks \
              -storepass mindjournal -keypass mindjournal -alias mindjournal \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mind Journal, OU=Personal, O=Mind Journal, L=Tbilisi, C=GE"
            echo "::warning::Generated a fresh signing key. It is cached, but if that cache is" \
                 "evicted the next APK will refuse to install over this one. Add a" \
                 "KEYSTORE_BASE64 secret (see README) to make signing permanent."
          fi

      # The SHA-256 fingerprint is the identity Android compares on update. If it changes
      # between runs, that is exactly why an install would be rejected.
      - name: Report signing identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore keystore/mindjournal.jks \
            -storepass "${KEYSTORE_PASSWORD:-mindjournal}" \
            | grep -E 'Alias name|SHA256:' | head -n 4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The wrapper JAR is a binary and is not committed; generate it on the runner so every
      # subsequent step uses the exact same Gradle version as a local checkout would.
      - name: Generate Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mind-journal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mind-journal-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
